name: Test

on:
  push:
    branches: [master, avalonia-12]
  pull_request:
    branches: [master, avalonia-12]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/*.csproj
            **/packages.lock.json

      # 不使用 --locked-mode：lock 文件里含 RuntimeIdentifiers（发布 -r win-x64 时写入）
      # 与 SDK 补丁相关的隐式包版本，CI 的普通还原与它天然不一致，locked mode 会误报 NU1004。
      - name: Restore dependencies
        run: dotnet restore RimTransAI.sln

      - name: Build
        run: dotnet build RimTransAI.sln --no-restore -c Release /p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet test tests/RimTransAI.Tests/RimTransAI.Tests.csproj --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 5

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 5
